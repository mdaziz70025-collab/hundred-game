name: card100game
description: "Card 100 Game Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Packages
  firebase_core: ^2.27.0
  firebase_auth: ^4.16.0
  firebase_database: ^10.4.0

  # Ads
  google_mobile_ads: ^4.0.0
  
  # Social Logins
  google_sign_in: ^6.1.6
  flutter_facebook_auth: ^6.0.4

  # UI Components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo.png
