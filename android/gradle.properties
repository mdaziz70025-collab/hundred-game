# 1. Gradle Heap Memory Increase (Fixes OutOfMemory / Java heap space errors)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m

# 2. AndroidX & Modern Gradle Compatibility
android.useAndroidX=true
android.enableJetifier=true

# 3. Non-transitive R Classes for faster build times
android.nonTransitiveRClass=true
